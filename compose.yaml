x-app: &app
  build:
    context: .
    target: runtime
  image: alliance-simulator:local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alliancesim
      POSTGRES_USER: alliancesim
      POSTGRES_PASSWORD: alliancesim
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alliancesim -d alliancesim"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    profiles: ["quality"]
    environment:
      POSTGRES_DB: alliancesim_test
      POSTGRES_USER: alliancesim
      POSTGRES_PASSWORD: alliancesim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alliancesim -d alliancesim_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    env_file:
      - path: .env
        required: false
    environment:
      ASIM_DATABASE_URL: postgresql+asyncpg://alliancesim:alliancesim@postgres:5432/alliancesim
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["alliancesim-api"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      ASIM_DATABASE_URL: postgresql+asyncpg://alliancesim:alliancesim@postgres:5432/alliancesim
      ASIM_HOST: 0.0.0.0
      ASIM_PORT: 8000
    ports:
      - "127.0.0.1:${ASIM_HTTP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  worker:
    <<: *app
    command: ["alliancesim-worker"]
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      ASIM_DATABASE_URL: postgresql+asyncpg://alliancesim:alliancesim@postgres:5432/alliancesim
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  telegram:
    <<: *app
    command: ["alliancesim-telegram"]
    init: true
    profiles: ["telegram"]
    env_file:
      - path: .env
        required: false
    environment:
      ASIM_DATABASE_URL: postgresql+asyncpg://alliancesim:alliancesim@postgres:5432/alliancesim
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  discord:
    <<: *app
    command: ["alliancesim-discord"]
    init: true
    profiles: ["discord"]
    env_file:
      - path: .env
        required: false
    environment:
      ASIM_DATABASE_URL: postgresql+asyncpg://alliancesim:alliancesim@postgres:5432/alliancesim
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  quality:
    build:
      context: .
      target: quality
    image: alliance-simulator:quality
    profiles: ["quality"]
    environment:
      ASIM_TEST_POSTGRES_URL: postgresql+asyncpg://alliancesim:alliancesim@postgres-test:5432/alliancesim_test
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  postgres-data:
