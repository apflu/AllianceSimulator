services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alliancesim
      POSTGRES_USER: alliancesim
      POSTGRES_PASSWORD: alliancesim
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alliancesim -d alliancesim"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
