[project]
name = "alliance-simulator"
version = "0.1.0"
description = "An asynchronous alliance management game for chat platforms"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alembic>=1.15,<2",
    "aiogram>=3.18,<4",
    "aiohttp-socks>=0.10,<1",
    "asyncpg>=0.30,<1",
    "discord.py>=2.5,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy[asyncio]>=2.0.38,<3",
    "structlog>=25.1,<26",
    "uvicorn>=0.34,<1",
]

[project.scripts]
alliancesim-api = "alliancesim.bootstrap.api:main"
alliancesim-discord = "alliancesim.bootstrap.discord_bot:main"
alliancesim-telegram = "alliancesim.bootstrap.telegram_bot:main"
alliancesim-worker = "alliancesim.bootstrap.worker:main"

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "hypothesis>=6.127,<7",
    "pyright>=1.1.396,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alliancesim"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires a real PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
allowed-confusables = ["，", "："]

[tool.ruff.lint.isort]
known-first-party = ["alliancesim"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.uv]
package = true
