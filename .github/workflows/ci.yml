name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: alliancesim_test
          POSTGRES_USER: alliancesim
          POSTGRES_PASSWORD: alliancesim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alliancesim -d alliancesim_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      ASIM_TEST_POSTGRES_URL: postgresql+asyncpg://alliancesim:alliancesim@127.0.0.1:5432/alliancesim_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pytest
